name: Python Automation CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python files
        run: |
          python -m py_compile notepad_report.py
          python -m py_compile email_notification.py
          python -m py_compile notepad_automation.py

      - name: Run automated tests
        run: python -m pytest -v

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Package application
        run: |
          Compress-Archive -Path notepad_report.py,email_notification.py,notepad_automation.py,requirements.txt -DestinationPath notepad-automation.zip -Force

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: notepad-automation.zip
          generate_release_notes: true
